[project]
name = "captcha-local"
version = "0.1.0"
description = "多题型验证码本地识别与自动化验证工具"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright==1.64.0",
    "numpy",
    "opencv-python-headless",
    "pillow",
    "onnxruntime",
    "ddddocr==1.6.1",
    "httpx==0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
captcha-local = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
