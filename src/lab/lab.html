<!doctype html><html lang="zh"><meta charset="utf-8"><title>本地验证码题库</title>
<style>
body{font:16px system-ui;margin:40px;background:#f4f6f8;color:#18252c}main{max-width:620px;background:white;padding:28px;border:1px solid #ccd4d9}h1{font-size:22px}button{padding:9px 18px;cursor:pointer}#stage{position:relative;overflow:hidden;touch-action:none;user-select:none;margin:16px 0}#background,#piece,canvas{position:absolute;left:0;top:0}#piece{cursor:grab}#rail{height:38px;background:#e1e6ea;position:relative;margin:14px 0}#handle{position:absolute;height:38px;width:32px;background:#276c8c;cursor:grab;touch-action:none;color:white;text-align:center}#status{min-height:24px}#hint{display:block;margin:12px 0}.dot{position:absolute;border-radius:100%;background:#c63434;color:white;width:22px;height:22px;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
</style><main><h1>本地验证码题库</h1><p id="instruction"></p><img id="hint" hidden><div id="stage"><img id="background"><canvas id="canvas" hidden></canvas><img id="piece" hidden></div><div id="rail" hidden><div id="handle">↔</div></div><button id="confirm" hidden>确认</button> <button id="refresh">换一题</button><p id="status" role="status"></p></main>
<script>
const params=new URLSearchParams(location.search),kind=params.get('kind')||'restore';
const scale=Math.min(1.4,Math.max(.6,Number(params.get('scale')||1)));
const $=id=>document.getElementById(id);let challenge,points=[],shift=0,busy=false;
const image=new Image();image.draggable=false;
function renderBand(){const c=$('canvas'),ctx=c.getContext('2d'),[x,y,w,h]=challenge.band;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(image,0,0);ctx.clearRect(x,y,w,h);let dx=((shift%w)+w)%w;ctx.drawImage(image,x,y,w-dx,h,x+dx,y,w-dx,h);if(dx)ctx.drawImage(image,x+w-dx,y,dx,h,x,y,dx,h);}
async function fresh(){busy=true;$('status').textContent='加载中';$('status').dataset.key='';$('status').dataset.state='';
 challenge=await (await fetch('/challenge?kind='+kind)).json();points=[];shift=0;document.querySelectorAll('.dot').forEach(e=>e.remove());
 const c=challenge;$('stage').dataset.key=c.key;$('stage').style.width=c.width*scale+'px';$('stage').style.height=c.height*scale+'px';
 $('background').src=c.background;$('background').style.width=c.width*scale+'px';$('background').style.height=c.height*scale+'px';await $('background').decode();
 $('piece').hidden=kind!=='drag2d';$('rail').hidden=!['restore','rotate-single'].includes(kind);$('canvas').hidden=kind!=='restore';$('hint').hidden=kind!=='icon';$('confirm').hidden=!['icon','font','order'].includes(kind);
 $('instruction').textContent={'rotate-single':'拖动滑块，使图片方向朝上',restore:'拖动横带，使图像恢复连续',drag2d:'把碎片拖到正确的缺口',icon:'按照提示，从左到右依次点击相同图形'}[kind]||c.instruction;
 if(kind==='restore'){const canvas=$('canvas');canvas.width=c.width;canvas.height=c.height;canvas.style.width=c.width*scale+'px';canvas.style.height=c.height*scale+'px';image.src=c.background;await image.decode();renderBand();$('rail').style.width=c.width*scale+32+'px';$('handle').style.left='0px';}
 if(kind==='rotate-single'){$('background').style.transform='rotate(0deg)';$('rail').style.width=c.width*scale+32+'px';$('handle').style.left='0px';}
 if(kind==='drag2d'){const p=$('piece');p.src=c.piece;await p.decode();p.style.width=p.naturalWidth*scale+'px';p.style.height=p.naturalHeight*scale+'px';p.style.left=c.start[0]*scale+'px';p.style.top=c.start[1]*scale+'px';}
 if(kind==='icon'){$('hint').src=c.hint;await $('hint').decode();}
 busy=false;$('status').textContent='请完成验证';
}
async function submit(answer){if(busy)return;busy=true;const key=challenge.key;const result=await(await fetch('/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,answer})})).json();
 if(key!==challenge.key)return;if(result.key!==key){$('status').textContent='回执不属于当前题目';busy=false;return;}
 $('status').dataset.key=key;$('status').dataset.state=result.accepted?'passed':'failed';$('status').textContent=result.accepted?'验证成功':'验证失败';busy=false;}
$('stage').addEventListener('click',e=>{if(!['icon','font','order'].includes(kind)||busy)return;let r=$('stage').getBoundingClientRect();let x=(e.clientX-r.left)/scale,y=(e.clientY-r.top)/scale;points.push([x,y]);const dot=document.createElement('span');dot.className='dot';dot.textContent=points.length;dot.style.left=x*scale+'px';dot.style.top=y*scale+'px';$('stage').append(dot);});
function draggable(el,onmove,onup){let drag=null;el.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();drag={x:e.clientX,y:e.clientY,left:parseFloat(el.style.left)||0,top:parseFloat(el.style.top)||0};el.setPointerCapture(e.pointerId);});el.addEventListener('pointermove',e=>{if(drag)onmove(e.clientX-drag.x,e.clientY-drag.y,drag);});el.addEventListener('pointerup',e=>{if(!drag)return;drag=null;el.releasePointerCapture(e.pointerId);onup();});el.addEventListener('pointercancel',()=>drag=null);}
draggable($('handle'),(dx,dy,start)=>{shift=Math.max(0,Math.min(challenge.width,(start.left+dx)/scale));$('handle').style.left=shift*scale+'px';if(kind==='rotate-single')$('background').style.transform='rotate('+(shift/challenge.width*360)+'deg)';else renderBand();},()=>submit(kind==='rotate-single'?{angle:shift/challenge.width*360}:{shift}));
draggable($('piece'),(dx,dy,start)=>{let p=$('piece');p.style.left=Math.max(0,Math.min(challenge.width*scale-p.offsetWidth,start.left+dx))+'px';p.style.top=Math.max(0,Math.min(challenge.height*scale-p.offsetHeight,start.top+dy))+'px';},()=>submit({point:[parseFloat($('piece').style.left)/scale,parseFloat($('piece').style.top)/scale]}));
$('confirm').onclick=()=>submit({points});$('refresh').onclick=()=>fresh();document.querySelectorAll('img').forEach(e=>e.draggable=false);
fresh().catch(e=>{$('status').textContent='加载失败：'+e.message;});
</script></html>
